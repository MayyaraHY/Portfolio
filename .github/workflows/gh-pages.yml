name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - my-portfolio

# Ensure the workflow token has the permissions required to publish Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Print Node & npm versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        # try npm ci (faster/clean) and fall back to npm install if no lockfile exists
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "--- dist summary ---"
          if [ -d "./dist" ]; then
            ls -la ./dist || true
            du -sh ./dist || true
          else
            echo "dist directory not found"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          allow_empty_commit: true
          # (note) the action will push build artifacts to the `gh-pages` branch
